syntax = "proto3";
package user.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "kratos-svr/api/user/v1;v1";
// 问题服务。
service QuestionService {
  // 创建问题。
  rpc CreateQuestion(CreateQuestionRequest) returns (Question) {
    option (gnostic.openapi.v3.operation) = {summary: "创建问题"};
    option (google.api.http) = {
      post: "/api/user/v1/questions"
      body: "*"
    };
  }
  // 获取问题。
  rpc GetQuestion(GetQuestionRequest) returns (Question) {
    option (gnostic.openapi.v3.operation) = {summary: "获取问题"};
    option (google.api.http) = {get: "/api/user/v1/questions/{id}"};
  }
  // 查询问题列表。
  rpc ListQuestions(ListQuestionsRequest) returns (ListQuestionsReply) {
    option (gnostic.openapi.v3.operation) = {summary: "查询问题列表"};
    option (google.api.http) = {get: "/api/user/v1/questions"};
  }
  // 更新问题。
  rpc UpdateQuestion(UpdateQuestionRequest) returns (Question) {
    option (gnostic.openapi.v3.operation) = {summary: "更新问题"};
    option (google.api.http) = {
      put: "/api/user/v1/questions/{question.id}"
      body: "*"
    };
  }
  // 删除问题。
  rpc DeleteQuestion(DeleteQuestionRequest) returns (google.protobuf.Empty) {
    option (gnostic.openapi.v3.operation) = {summary: "删除问题"};
    option (google.api.http) = {delete: "/api/user/v1/questions/{id}"};
  }
  // 审核问题。
  rpc ReviewQuestion(ReviewQuestionRequest) returns (Question) {
    option (gnostic.openapi.v3.operation) = {summary: "审核问题"};
    option (google.api.http) = {
      post: "/api/user/v1/questions/{id}:review"
      body: "*"
    };
  }
}
// 问题数据。
message Question {
  // 唯一编号。
  uint64 id = 1;
  // 关键词编号。
  uint64 keyword_id = 2;
  // 品牌编号。
  uint64 brand_id = 3;
  // 文本。
  string text = 4;
  // 状态。
  int32 status = 5;
  // 意图。
  int32 intent = 6;
  // 受众。
  string audience = 7;
  // 漏斗阶段。
  int32 funnel_stage = 8;
  // 集群编码。
  string cluster_code = 9;
  // 任务优先级。
  int32 priority = 10;
  // 排序值。
  int32 sort_order = 11;
  // 数据版本号。
  uint64 version = 12;
  // 创建时间。
  google.protobuf.Timestamp created_at = 13;
  // 更新时间。
  google.protobuf.Timestamp updated_at = 14;
  // 可选区域。
  string region = 15;
  // 来源：1手工创建、2大模型蒸馏。
  int32 source = 16;
  // 蒸馏任务编号。
  uint64 distillation_task_id = 17;
}
// 创建问题请求参数。
message CreateQuestionRequest {
  // 问题。
  Question question = 1;
}
// 获取问题请求参数。
message GetQuestionRequest {
  // 唯一编号。
  uint64 id = 1;
}
// 查询问题列表请求参数。
message ListQuestionsRequest {
  // 每页记录数。
  int32 page_size = 1;
  // 分页令牌。
  string page_token = 2;
  // 品牌编号。
  uint64 brand_id = 3;
  // 关键词编号。
  uint64 keyword_id = 4;
  // 状态。
  int32 status = 5;
  // 搜索关键词。
  string keyword = 6;
}
// 查询问题列表响应结果。
message ListQuestionsReply {
  // 数据列表。
  repeated Question items = 1;
  // 下一页分页令牌。
  string next_page_token = 2;
  // 总记录数。
  int64 total_size = 3;
}
// 更新问题请求参数。
message UpdateQuestionRequest {
  // 问题。
  Question question = 1;
}
// 删除问题请求参数。
message DeleteQuestionRequest {
  // 唯一编号。
  uint64 id = 1;
  // 数据版本号。
  uint64 version = 2;
}
// 审核问题请求参数。
message ReviewQuestionRequest {
  // 唯一编号。
  uint64 id = 1;
  // 数据版本号。
  uint64 version = 2;
  // 操作类型。
  string action = 3;
  // 操作原因。
  string reason = 4;
}
