syntax = "proto3";
package user.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "user/v1/catalog.proto";

option go_package = "kratos-svr/api/user/v1;v1";
// 平台授权账号服务。
service PlatformAccountService {
  // 查询平台账号列表。
  rpc ListPlatformAccounts(ListPlatformAccountsRequest) returns (ListPlatformAccountsReply) {
    option (gnostic.openapi.v3.operation) = {summary: "查询平台账号列表"};
    option (google.api.http) = {get: "/api/user/v1/platform-accounts"};
  }
  // 获取平台账号的最新有效授权凭据。
  rpc GetPlatformAccountCredential(GetPlatformAccountCredentialRequest) returns (PlatformAccountCredential) {
    option (gnostic.openapi.v3.operation) = {summary: "获取平台账号授权凭据"};
    option (google.api.http) = {get: "/api/user/v1/platform-accounts/{account_id}/credential"};
  }
  // 创建授权会话。
  rpc CreateAuthorizationSession(CreateAuthorizationSessionRequest) returns (AuthorizationSession) {
    option (gnostic.openapi.v3.operation) = {summary: "创建授权会话"};
    option (google.api.http) = {
      post: "/api/user/v1/platform-accounts/authorization-sessions"
      body: "*"
    };
  }
  // 获取授权会话。
  rpc GetAuthorizationSession(GetAuthorizationSessionRequest) returns (AuthorizationSession) {
    option (gnostic.openapi.v3.operation) = {summary: "获取授权会话"};
    option (google.api.http) = {get: "/api/user/v1/platform-accounts/authorization-sessions/{session_id}"};
  }
  // 变更平台账号状态。
  rpc ChangePlatformAccountStatus(ChangePlatformAccountStatusRequest) returns (PlatformAccount) {
    option (gnostic.openapi.v3.operation) = {summary: "变更平台账号状态"};
    option (google.api.http) = {
      post: "/api/user/v1/platform-accounts/{account_id}:status"
      body: "*"
    };
  }
  // 删除平台授权账号。
  rpc DeletePlatformAccount(DeletePlatformAccountRequest) returns (google.protobuf.Empty) {
    option (gnostic.openapi.v3.operation) = {summary: "删除平台授权账号"};
    option (google.api.http) = {delete: "/api/user/v1/platform-accounts/{account_id}"};
  }
}
// 客户端授权服务。
service ClientAuthorizationService {
  // 获取客户端配置。
  rpc GetClientConfig(GetClientConfigRequest) returns (ClientConfig) {
    option (gnostic.openapi.v3.operation) = {summary: "获取客户端配置"};
    option (google.api.http) = {get: "/api/user/v1/client/config"};
  }
  // 提交授权。
  rpc SubmitAuthorization(SubmitAuthorizationRequest) returns (PlatformAccount) {
    option (gnostic.openapi.v3.operation) = {summary: "提交授权"};
    option (google.api.http) = {
      post: "/api/user/v1/client/authorization-sessions/{session_token}:submit"
      body: "*"
    };
  }
  // 上报授权心跳。
  rpc ReportAuthorizationHeartbeat(ReportAuthorizationHeartbeatRequest) returns (AuthorizationSession) {
    option (gnostic.openapi.v3.operation) = {summary: "上报授权心跳"};
    option (google.api.http) = {
      post: "/api/user/v1/client/authorization-sessions/{session_token}:heartbeat"
      body: "*"
    };
  }
}
// 平台授权账号数据。
message PlatformAccount {
  // 唯一编号。
  uint64 id = 1;
  // 资源类型：1 表示自媒体投放渠道，2 表示模型检测站点。
  int32 resource_type = 2;
  // 资源编号。
  uint64 resource_id = 3;
  // 授权账号名称。
  string account_name = 4;
  // 外部平台账号编号。
  string external_id = 5;
  // 脱敏身份标识。
  string masked_identity = 6;
  // 授权状态。
  int32 authorization_status = 7;
  // 使用状态。
  int32 usage_status = 8;
  // 过期时间。
  google.protobuf.Timestamp expires_at = 9;
  // 最近验证时间。
  google.protobuf.Timestamp last_verified_at = 10;
  // 最近使用时间。
  google.protobuf.Timestamp last_used_at = 11;
  // 每日使用上限。
  int64 daily_limit = 12;
  // 是否为默认项。
  bool is_default = 13;
  // 扩展元数据 JSON。
  string metadata_json = 14;
  // 数据版本号。
  uint64 version = 15;
}
// 授权会话数据。
message AuthorizationSession {
  // 唯一编号。
  uint64 id = 1;
  // 授权会话令牌。
  string session_token = 2;
  // 客户端设备编号。
  string device_id = 3;
  // 资源类型。
  int32 resource_type = 4;
  // 资源编号。
  uint64 resource_id = 5;
  // 平台账号编号。
  uint64 platform_account_id = 6;
  // 状态。
  int32 status = 7;
  // 过期时间。
  google.protobuf.Timestamp expires_at = 8;
  // 完成时间。
  google.protobuf.Timestamp completed_at = 9;
}
// 客户端配置数据。
message ClientConfig {
  // 最低支持版本。
  string minimum_version = 1;
  // 最新客户端版本。
  string latest_version = 2;
  // 是否强制升级。
  bool force_upgrade = 3;
  // 客户端下载地址。
  string download_url = 4;
  // 可授权目标列表。
  repeated CatalogItem authorization_targets = 5;
}
// 查询平台账号列表请求参数。
message ListPlatformAccountsRequest {
  // 资源类型：1 表示自媒体投放渠道，2 表示模型检测站点；不传则查询全部。
  int32 resource_type = 1;
  // 资源编号。
  uint64 resource_id = 2;
  // 状态。
  int32 status = 3;
}
// 查询平台账号列表响应结果。
message ListPlatformAccountsReply {
  // 数据列表。
  repeated PlatformAccount items = 1;
}
// 平台账号授权凭据。
message PlatformAccountCredential {
  // 平台账号编号。
  uint64 account_id = 1;
  // 客户端加密后的授权凭据密文。
  string credential_payload = 2;
}
// 获取平台账号授权凭据请求参数。
message GetPlatformAccountCredentialRequest {
  // 平台账号编号。
  uint64 account_id = 1;
}
// 创建授权会话请求参数。
message CreateAuthorizationSessionRequest {
  // 客户端设备编号。
  string device_id = 1;
  // 资源类型。
  int32 resource_type = 2;
  // 资源编号。
  uint64 resource_id = 3;
  // 平台账号编号。
  uint64 platform_account_id = 4;
}
// 获取授权会话请求参数。
message GetAuthorizationSessionRequest {
  // 会话编号。
  uint64 session_id = 1;
}
// 变更平台账号状态请求参数。
message ChangePlatformAccountStatusRequest {
  // 账号编号。
  uint64 account_id = 1;
  // 数据版本号。
  uint64 version = 2;
  // 操作类型。
  string action = 3;
}
// 删除平台授权账号请求参数。
message DeletePlatformAccountRequest {
  // 账号编号。
  uint64 account_id = 1;
  // 数据版本号。
  uint64 version = 2;
}
// 获取客户端配置请求参数。
message GetClientConfigRequest {
  // 客户端版本。
  string client_version = 1;
  // 客户端设备编号。
  string device_id = 2;
}
// 提交授权请求参数。
message SubmitAuthorizationRequest {
  // 授权会话令牌。
  string session_token = 1;
  // 授权账号名称。
  string account_name = 2;
  // 外部平台账号编号。
  string external_id = 3;
  // 脱敏身份标识。
  string masked_identity = 4;
  // 授权凭据密文文本载荷（当前为 aes:v2: 前缀的共享 AES-GCM 封装）。
  string credential_payload = 5;
  // 过期时间。
  google.protobuf.Timestamp expires_at = 6;
  // 扩展元数据 JSON。
  string metadata_json = 7;
  // 客户端版本。
  string client_version = 8;
}
// 上报授权心跳请求参数。
message ReportAuthorizationHeartbeatRequest {
  // 授权会话令牌。
  string session_token = 1;
  // 状态。
  string status = 2;
  // 客户端版本。
  string client_version = 3;
}
