syntax = "proto3";

package common.v1;

option go_package = "kratos-svr/api/common/v1;v1";

// 文章结构章节。
message ArticleTypeSection {
  // 章节标题。
  string title = 1;
  // 章节写作要求。
  string guidance = 2;
  // 是否必须生成该章节。
  bool required = 3;
}

// 文章生成输入项。
message ArticleTypeInputField {
  // 输入项键名，用于提示词变量，例如 topic。
  string key = 1;
  // 输入项中文名称。
  string label = 2;
  // 输入类型：1 单行文本、2 多行文本、3 数字、4 单选、5 多选。
  int32 input_type = 3;
  // 是否必填。
  bool required = 4;
  // 输入提示。
  string placeholder = 5;
  // 帮助说明。
  string help_text = 6;
  // 选择项列表，仅单选和多选使用。
  repeated string options = 7;
  // 默认值。
  string default_value = 8;
}

// 文章类型生成配置。
message ArticleTypeConfig {
  // 内容生成目标。
  string content_goal = 1;
  // 目标受众。
  string target_audience = 2;
  // 文章语气。
  string tone = 3;
  // 建议最小字数。
  uint32 recommended_min_words = 4;
  // 建议最大字数。
  uint32 recommended_max_words = 5;
  // 文章章节结构。
  repeated ArticleTypeSection sections = 6;
  // 企业生成时需要填写的输入项。
  repeated ArticleTypeInputField input_fields = 7;
  // GEO 优化规则。
  repeated string geo_rules = 8;
  // 质量检查规则。
  repeated string quality_rules = 9;
  // 大模型系统提示词。
  string system_prompt = 10;
  // 用户提示词模板，支持使用 {{.变量名}} 引用输入项和内置品牌变量。
  string user_prompt_template = 11;
  // 输出格式：1 Markdown。
  int32 output_format = 12;
  // 可用写作模型编号列表；为空时允许企业使用全部已授权模型。
  repeated uint64 writing_model_ids = 13;
  // 默认写作模型编号；为 0 时由企业选择。
  uint64 default_writing_model_id = 14;
  // 适用投放渠道编号列表；为空时表示不限制渠道。
  repeated uint64 publish_channel_ids = 15;
}
