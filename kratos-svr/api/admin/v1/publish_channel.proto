syntax = "proto3";

package admin.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "kratos-svr/api/admin/v1;v1";

// 投放渠道服务。
service PublishChannelService {
  // 创建投放渠道。
  rpc CreatePublishChannel(CreatePublishChannelRequest) returns (PublishChannel) {
    option (gnostic.openapi.v3.operation) = {summary: "创建投放渠道"};
    option (google.api.http) = {
      post: "/api/admin/v1/publish-channels"
      body: "*"
    };
  }
  // 获取投放渠道。
  rpc GetPublishChannel(GetPublishChannelRequest) returns (PublishChannel) {
    option (gnostic.openapi.v3.operation) = {summary: "获取投放渠道"};
    option (google.api.http) = {get: "/api/admin/v1/publish-channels/{id}"};
  }
  // 查询发布渠道列表。
  rpc ListPublishChannels(ListPublishChannelsRequest) returns (ListPublishChannelsReply) {
    option (gnostic.openapi.v3.operation) = {summary: "查询发布渠道列表"};
    option (google.api.http) = {get: "/api/admin/v1/publish-channels"};
  }
  // 更新投放渠道。
  rpc UpdatePublishChannel(UpdatePublishChannelRequest) returns (PublishChannel) {
    option (gnostic.openapi.v3.operation) = {summary: "更新投放渠道"};
    option (google.api.http) = {
      put: "/api/admin/v1/publish-channels/{publish_channel.id}"
      body: "*"
    };
  }
  // 删除投放渠道。
  rpc DeletePublishChannel(DeletePublishChannelRequest) returns (google.protobuf.Empty) {
    option (gnostic.openapi.v3.operation) = {summary: "删除投放渠道"};
    option (google.api.http) = {delete: "/api/admin/v1/publish-channels/{id}"};
  }
  // 上传发布渠道图标。
  rpc UploadPublishChannelIcon(UploadPublishChannelIconRequest) returns (UploadPublishChannelIconReply) {
    option (gnostic.openapi.v3.operation) = {summary: "上传发布渠道图标"};
    option (google.api.http) = {
      post: "/api/admin/v1/publish-channel-icons"
      body: "*"
    };
  }
  // 创建发布目标。
  rpc CreatePublishTarget(CreatePublishTargetRequest) returns (PublishTarget) {
    option (gnostic.openapi.v3.operation) = {summary: "创建发布目标"};
    option (google.api.http) = {
      post: "/api/admin/v1/publish-channels/{publish_channel_id}/targets"
      body: "*"
    };
  }
  // 查询发布目标列表。
  rpc ListPublishTargets(ListPublishTargetsRequest) returns (ListPublishTargetsReply) {
    option (gnostic.openapi.v3.operation) = {summary: "查询发布目标列表"};
    option (google.api.http) = {get: "/api/admin/v1/publish-channels/{publish_channel_id}/targets"};
  }
  // 更新发布目标。
  rpc UpdatePublishTarget(UpdatePublishTargetRequest) returns (PublishTarget) {
    option (gnostic.openapi.v3.operation) = {summary: "更新发布目标"};
    option (google.api.http) = {
      put: "/api/admin/v1/publish-channels/{publish_channel_id}/targets/{target.id}"
      body: "*"
    };
  }
  // 删除发布目标。
  rpc DeletePublishTarget(DeletePublishTargetRequest) returns (google.protobuf.Empty) {
    option (gnostic.openapi.v3.operation) = {summary: "删除发布目标"};
    option (google.api.http) = {delete: "/api/admin/v1/publish-channels/{publish_channel_id}/targets/{target_id}"};
  }
}

// 投放渠道数据。
message PublishChannel {
  // 唯一编号。
  uint64 id = 1;
  // 业务编码。
  string code = 2;
  // 名称。
  string name = 3;
  // 分类。
  int32 category = 4;
  // 图标地址。
  string icon = 5;
  // 说明。
  string description = 6;
  // 状态。
  int32 status = 7;
  // 授权方式。
  int32 authorization_type = 8;
  // 执行模式。
  int32 execution_mode = 9;
  reserved 10, 11, 12;
  reserved "capabilities_json", "rules_json", "visibility_json";
  // 驱动版本。
  string driver_version = 13;
  // 排序值。
  int32 sort_order = 14;
  // 数据版本号。
  uint64 version = 15;
  // 创建时间。
  google.protobuf.Timestamp created_at = 16;
  // 更新时间。
  google.protobuf.Timestamp updated_at = 17;
  // 客户端自动化驱动类型，从 1 开始，不等同于业务编码。
  int32 driver_type = 18;
  // 客户端授权登录入口。
  string login_url = 19;
  reserved 20;
  reserved "publish_entry_url";
}
// 发布目标数据。
message PublishTarget {
  // 唯一编号。
  uint64 id = 1;
  // 发布渠道编号。
  uint64 publish_channel_id = 2;
  // 名称。
  string name = 3;
  // 目标类型。
  int32 target_type = 4;
  // 平台。
  string platform = 5;
  // 站点入口地址。
  string entry_url = 6;
  // 投稿邮箱。
  string submission_email = 7;
  // 区域。
  string region = 8;
  // 行业。
  string industry = 9;
  // 渠道合作配置 JSON。
  string cooperation_json = 10;
  // 投稿要求 JSON。
  string requirements_json = 11;
  // 状态。
  int32 status = 12;
  // 排序值。
  int32 sort_order = 13;
  // 数据版本号。
  uint64 version = 14;
  // 创建时间。
  google.protobuf.Timestamp created_at = 15;
  // 更新时间。
  google.protobuf.Timestamp updated_at = 16;
}
// 创建投放渠道请求参数。
message CreatePublishChannelRequest {
  // 发布渠道。
  PublishChannel publish_channel = 1;
}
// 获取投放渠道请求参数。
message GetPublishChannelRequest {
  // 唯一编号。
  uint64 id = 1;
}
// 查询发布渠道列表请求参数。
message ListPublishChannelsRequest {
  // 每页记录数。
  int32 page_size = 1;
  // 分页令牌。
  string page_token = 2;
  // 分类。
  int32 category = 3;
  // 状态。
  int32 status = 4;
  // 搜索关键词。
  string keyword = 5;
}
// 查询发布渠道列表响应结果。
message ListPublishChannelsReply {
  // 数据列表。
  repeated PublishChannel items = 1;
  // 下一页分页令牌。
  string next_page_token = 2;
  // 总记录数。
  int64 total_size = 3;
}
// 更新投放渠道请求参数。
message UpdatePublishChannelRequest {
  // 发布渠道。
  PublishChannel publish_channel = 1;
}
// 删除投放渠道请求参数。
message DeletePublishChannelRequest {
  // 唯一编号。
  uint64 id = 1;
  // 数据版本号。
  uint64 version = 2;
}
// 上传发布渠道图标请求参数。
message UploadPublishChannelIconRequest {
  // 文件名。
  string filename = 1;
  // 内容类型。
  string content_type = 2;
  // 内容。
  bytes content = 3;
}
// 上传发布渠道图标响应结果。
message UploadPublishChannelIconReply {
  // 地址。
  string url = 1;
}
// 创建发布目标请求参数。
message CreatePublishTargetRequest {
  // 发布渠道编号。
  uint64 publish_channel_id = 1;
  // 目标。
  PublishTarget target = 2;
}
// 查询发布目标列表请求参数。
message ListPublishTargetsRequest {
  // 发布渠道编号。
  uint64 publish_channel_id = 1;
  // 目标类型。
  int32 target_type = 2;
  // 状态。
  int32 status = 3;
}
// 查询发布目标列表响应结果。
message ListPublishTargetsReply {
  // 数据列表。
  repeated PublishTarget items = 1;
}
// 更新发布目标请求参数。
message UpdatePublishTargetRequest {
  // 发布渠道编号。
  uint64 publish_channel_id = 1;
  // 目标。
  PublishTarget target = 2;
}
// 删除发布目标请求参数。
message DeletePublishTargetRequest {
  // 发布渠道编号。
  uint64 publish_channel_id = 1;
  // 目标编号。
  uint64 target_id = 2;
  // 数据版本号。
  uint64 version = 3;
}
