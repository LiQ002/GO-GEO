appId: "com.articlepublisher.operator"
productName: "GEO-Operator"
copyright: "Copyright (c) 2026 ZhiLiaoGuanNian"
directories:
  buildResources: resources/operator
  output: dist/operator
asar: true
asarUnpack:
  - main/electron/worker/**
  - main/lib/**
  - main/electron/main/services/CredentialService.js
  - node_modules/puppeteer/**
  - node_modules/puppeteer-core/**
  - node_modules/puppeteer-extra/**
  - node_modules/puppeteer-extra-plugin-stealth/**
files:
  - main/**/*
  - out/**/*
  - package.json
  - node_modules/puppeteer/**/*
  - node_modules/puppeteer-core/**/*
  - node_modules/puppeteer-extra/**/*
  - node_modules/puppeteer-extra-plugin-stealth/**/*
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  target: dmg
win:
  executableName: "GEO-Operator"
  requestedExecutionLevel: "requireAdministrator"
  target: nsis
nsis:
  perMachine: true
  runAfterFinish: true
  allowToChangeInstallationDirectory: true
  oneClick: false
